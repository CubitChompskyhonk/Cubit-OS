{% extends "base.html" %}
{% block title %}Projects — Cubit OS{% endblock %}
{% block content %}
<h1>Projects</h1>
<table>
  <thead><tr><th>Status</th><th>Name</th><th>Next action</th></tr></thead>
  <tbody>
  {% for p in projects %}
    <tr>
      <td><span class="badge">{{ p.status }}</span></td>
      <td>{{ p.name }}</td>
      <td class="muted">{{ p.next_action }}</td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="muted">No projects yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
