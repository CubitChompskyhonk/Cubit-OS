<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Cubit OS{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <h2>Cubit</h2>
      <p class="muted">AI Operations Manager</p>
      <nav>
        <a href="/">Chat</a>
        <a href="/briefing">Briefing</a>
        <a href="/projects">Projects</a>
        <a href="/tasks">Tasks</a>
        <a href="/journal">Journal</a>
        <a href="/chronicle">Chronicle</a>
        <a href="/reason">Reason</a>
      </nav>
      <p class="muted" style="margin-top:2rem;font-size:0.8rem;">Foundation before expansion.</p>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
    <aside class="focus">
      {% block focus %}
      <h3>Focus</h3>
      <p class="muted">Steward strip loads with pages that provide it.</p>
      {% endblock %}
    </aside>
  </div>
</body>
</html>
